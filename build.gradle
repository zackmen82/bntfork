plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://maven.createmod.net' }
    maven { url 'https://mvn.devos.one/snapshots' }
    maven { url 'https://maven.blamejared.com' }
    flatDir {
        dirs 'libs'
    }
}

neoForge {
    version = neo_version

    mods {
        bits_n_tracks {
            sourceSet project.sourceSets.main
        }
    }
}

dependencies {
    // Compile against the latest public 1.21.1 NeoForge jars in libs/.
    // Runtime: regular CurseForge/Modrinth Bits 'n' Bobs 2.2.x (NOT the old GitHub 2.0.2).
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar') // includes catnip
    compileOnly files('libs/flywheel-neoforge-1.21.1-1.0.6.jar')
    compileOnly files('libs/Registrate-MC1.21-1.3.0+67.jar')
    compileOnly files('libs/azimuth-1.4.7.jar')
    compileOnly files('libs/struts-1.3.0.jar')
    compileOnly files('libs/bits_n_bobs-2.2.5.jar')
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.5.jar')
    compileOnly files('libs/sable-companion-common-1.21.1-1.5.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes('FMLModType': 'GAMELIBRARY')
    }
}
